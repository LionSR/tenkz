name: Tenkz Dispositions Guard

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Check retired tenkz fixtures stay disposed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan retired-fixture dispositions
        run: |
          python3 scripts/test_check_tenkz_dispositions.py
          python3 scripts/check_tenkz_dispositions.py
