name: Tenkz Release Policy

# Build and test the upload artifact; publication requires maintainer approval.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-payload:
    name: Check tenkz release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      # The upload archive carries the built manual, so the release-payload
      # job produces that input through the same reproducible entry point as
      # pr-ci.yml before it checks the staging contract.  The installed engine
      # also makes the archive's clean-install smoke test mandatory here.
      - name: Install TeX dependencies
        uses: texra-ai/lean-env-action/blueprint-system-deps@dd809c3886f8e88a184f2a37aa865c60183762a7

      - name: Build the release manual reproducibly
        run: python3 scripts/tenkz_manual_build.py check --require-engine

      - name: Test the CTAN staging contracts
        run: python3 scripts/test_tenkz_ctan.py

      - name: Check the CTAN staging tree and its archive
        run: python3 scripts/tenkz_ctan.py check --require-smoke
